# 路径设置可以使用绝对路径或相对路径，正斜杠和反斜杠均可，推荐使用绝对路径。
[SfM]
# 是否使用自定义焦距参数。
useFocalLength=true
useFactor=0.704
# useFactor=0.2
# 相机模型，可选：SIMPLE_PINHOLE、PINHOLE、SIMPLE_RADIAL、RADIAL。
cameraModel=SIMPLE_RADIAL
# 每次影像注册后局部 BA 的迭代轮数。默认 2；可设为 1 以提升速度，或设为更大的整数增强局部优化。
numLocalBAIters=1
# 每张影像最多保留的 SIFT 特征点数量。
# GPU SIFT 通过 SiftGPU -tc2 控制，CPU SIFT 使用同一上限筛选。
maxNumFeatures=4096
# 自动输入时允许积压的最大首次SfM处理影像数量，不包含待补注册池。
# 首次处理结束后释放名额，避免等待补注册的影像阻塞新输入。
# 设为0表示关闭积压限流。
MaxPendingImages=200
# 每新增这些成功注册影像，或持续这些秒无注册进展时，检查待注册池。
RegistrationRetryInterval=500
RegistrationRetryIdleSeconds=60

[BundleAdjustment]
# Local BA 使用 CUDA dense solver 的最小观测数。
# 低于该值时使用 CPU dense solver，避免小规模 BA 的 CUDA 启动/同步开销。
# LocalBACudaMinObservations=80
LocalBACudaMinObservations=800000

[Pipeline]
# 是否自动重建文件夹中已有的图片。false 表示只重建移动端新上传的图片。
AutoRunImages=true
# 是否自动导出模型。
AutoExportModel=false
# 初始化重建所需影像数量。
InitialImagesNum=30
# 是否导出 3D Gaussian Splatting 中间结果。(用于A-TDOM中的On-the-Fly GS重建：https://github.com/xywjohn/A-TDOM)
# Whether to export intermediate results of 3D Gaussian Splatting.
Export3DGS = false
# 是否输出运行计时与资源统计 CSV；关闭后不写 DenseReconstruction/Timing 下的新统计文件。
OutputTimingFiles=true

[Python]
# Python 环境根目录，选择 python.exe 所在的根目录即可。
PythonHome=../../thirdparty/Python

# Python 脚本工作目录,即Python代码存储目录。
PythonWorkspace=../../scripts/pyscripts

# 深度学习权重目录，已弃用。
# GlobalFeatureModel=D:\OntheFlySfM\OntheFlySfM\scripts\pyscripts

[GlobalFeature]
# 全局特征提取器类型，可选：VGG、SupScene。
GlobalFeatureType=SupScene

#========== SupScene 全局特征配置 ==========
# SupScene 使用 SCPP，输出 1536 维全局特征；实测单张热推理约 80-100 ms，但依赖 peft/transformers/safetensors。
# 可选：cuda、cpu。
SupSceneDevice=cuda
# SupScene 权重路径。auto 表示读取 scripts/pyscripts/Supscene/checkpoints/dinov2_scpp_supscene_1536.pth。
SupSceneWeightsPath=auto

[DenseDepth]
# 是否启用实时深度估计。启用后会启动独立 Python 进程预测深度图。
Enable=true
# 深度估计方法，可选：Murre、PriorDepthAnything、DepthAnythingV2、DepthAnything3、PixelPerfectDepth、MoGe。后续新方法会继续扩展该参数。
Method=DepthAnythingV2
# 注册影像数量达到该阈值后，先执行一次全局 BA + COLMAP 风格 Normalize(extent=10)，随后才开始深度估计和密集融合。
StartRegisteredImages=30
# 深度估计设备，可选：cuda、cpu。显存紧张时可设为 cpu，但速度会明显变慢。
Device=cuda
# 单张深度估计超时时间，单位毫秒。
TimeoutMs=600000
# 是否为 Python worker 额外导出当前 SfM 模型到 DenseReconstruction/DepthInput/bin。
# 默认 false；当前内置深度方法优先使用 C++ 传入的 DepthFrameInfo，不再依赖该目录。
ExportSfMBin=false
# 最终输出 depth map 的长边分辨率。<=0 表示输出原图尺寸；公平对比实验建议统一为 14 和 16 公倍数，例如 560/784/1008。
OutputResolution=784

#========== Murre 深度估计配置 ==========
# Murre 输入处理分辨率，建议使用 14 和 16 的公倍数；主实验默认 784。
MurreProcessingResolution=784
# Murre 以及后续 TSDF 融合接受的最大深度，超过该值的深度会被截断。
MurreMaxDepth=50.0
# Murre 推理去噪步数，值越大通常越慢。
MurreDenoiseSteps=4
# Murre 集成预测次数，值越大通常越稳定但越慢。
MurreEnsembleSize=1

#========== PriorDepthAnything 深度估计配置 ==========
# PriorDepthAnything 输入处理分辨率。<=0 表示不缩放，直接使用原图分辨率；>0 时必须设置为 14 的倍数。主实验默认 784。
PriorDAProcessingResolution=784
# PriorDepthAnything 以及后续 TSDF 融合接受的最大深度，超过该值的深度会被截断。DenseDepth 启动前会先 Normalize，通常设为 50 即可。
PriorDAMaxDepth=50.0
# PriorDepthAnything 模型版本，可选：1.0、1.1。
PriorDAVersion=1.1
# PriorDepthAnything 粗阶段 Depth Anything 模型大小，可选：vits、vitb。
PriorDAFrozenModelSize=vitb
# PriorDepthAnything 细阶段模型大小，可选：vits、vitb。
PriorDAConditionedModelSize=vitb
# PriorDepthAnything sparse prior 采样模式。留空表示直接使用 SfM 稀疏深度作为 prior。
PriorDAPattern=

#========== DepthAnythingV2 深度估计配置 ==========
# DepthAnythingV2 输入处理分辨率，必须为 14 的正整数倍；主实验默认 784。
DepthAnythingV2ProcessingResolution=784
# DepthAnythingV2 以及后续 TSDF 融合接受的最大深度，超过该值的深度会被截断。
# DepthAnythingV2 输出为相对深度，用于 TSDF 时必须开启 [DepthAlignment] Enable=true。
DepthAnythingV2MaxDepth=5000.0
# DepthAnythingV2 编码器，可选：vits、vitb、vitl、vitg。需要 checkpoints 目录下存在对应 depth_anything_v2_*.pth。
DepthAnythingV2Encoder=vitl

#========== DepthAnything3 深度估计配置 ==========
# DepthAnything3 模型目录名，需要位于 scripts/pyscripts/DepthEstimation/DepthAnything3/checkpoints 下。
# 可选模型目录名与能力说明如下：
# DA3NESTED-GIANT-LARGE-1.1：Nested 系列，约 1.40B 参数；支持相对深度、位姿估计、Pose-Conditioned Depth、3D Gaussian、Metric Depth、Sky Seg；输出 depth/conf/extrinsics/intrinsics，可用于 pointmap/TSDF。推荐用于多视图几何一致和米制尺度，但显存/耗时最高。
# DA3-GIANT-1.1：Any-view 主系列，约 1.15B 参数；支持相对深度、位姿估计、Pose-Conditioned Depth、3D Gaussian；输出 depth/conf/extrinsics/intrinsics，可生成 pointmap。适合高质量多视图几何，但不如 Nested 直接米制。
# DA3-LARGE-1.1：Any-view 主系列，约 0.35B 参数；支持相对深度、位姿估计、Pose-Conditioned Depth；输出 depth/conf/extrinsics/intrinsics，可用于多视图一致深度，速度/显存更平衡。
# DA3-BASE：Any-view 主系列，约 0.12B 参数；支持相对深度、位姿估计、Pose-Conditioned Depth；输出 depth/conf/extrinsics/intrinsics，适合轻量测试。
# DA3-SMALL：Any-view 主系列，约 0.08B 参数；支持相对深度、位姿估计、Pose-Conditioned Depth；输出 depth/conf/extrinsics/intrinsics，速度最快但精度较低。
# DA3METRIC-LARGE：Monocular Metric Depth 系列，约 0.35B 参数；支持相对深度、Metric Depth、Sky Seg；主要输出单目 metric depth/conf，适合单帧米制深度 + TSDF/Alignment。
# DA3MONO-LARGE：Monocular Depth 系列，约 0.35B 参数；支持相对深度、Sky Seg；主要输出单目 depth/conf，推荐作为默认单目深度路线，配合 DepthAlignment 后进入 TSDF。
# 官方说明：-1.1 为修复训练 bug 后的刷新模型，街景等场景表现更好；同名旧版 checkpoint 不优先推荐。
DepthAnything3Model=DA3MONO-LARGE
# DA3 处理分辨率，越大细节越多但显存/耗时越高；主实验默认 784。
DepthAnything3ProcessingResolution=784
# DA3 处理分辨率策略，可选 upper_bound_resize、lower_bound_resize 等 DA3 官方支持模式。
DepthAnything3ProcessResMethod=upper_bound_resize
# DA3 以及后续 TSDF 接受的最大深度，超过该值的深度会被截断。
DepthAnything3MaxDepth=50.0
# 当前系统的 DA3 worker 采用逐帧单目推理，不启用 DA3 multi-view / pose-conditioned 输入；几何一致性由 DepthAlignment 处理。
# DA3 confidence 阈值，低于该值的深度/pointmap 像素会置为无效；0 表示不过滤。
DepthAnything3ConfThreshold=0.0

#========== PixelPerfectDepth 深度估计配置 ==========
# PixelPerfectDepth 输出为相对深度，用于 TSDF 时必须开启 [DepthAlignment] Enable=true。
# PixelPerfectDepth 语义编码器，可选：DA2、MoGe2。DA2 使用 depth_anything_v2_vitl.pth+ppd.pth；MoGe2 使用 moge2.pt+ppd_moge.pth。
PixelPerfectDepthSemanticsModel=MoGe2
# PixelPerfectDepth 推理处理分辨率。<=0 表示使用模型默认策略；主实验默认 784。
PixelPerfectDepthProcessingResolution=784
# PixelPerfectDepth diffusion 采样步数，值越大通常细节/稳定性越好，但速度越慢。实时流程建议先用 4。
PixelPerfectDepthSamplingSteps=4
# PixelPerfectDepth 以及后续 TSDF 融合接受的最大深度，超过该值的深度会被截断。
PixelPerfectDepthMaxDepth=50.0
# 是否使用 CUDA FP16 混合精度。仅在 Device=cuda 时生效，可降低显存并加速。
PixelPerfectDepthFP16=true

#========== MoGe2 深度估计配置 ==========
# MoGe2 模型目录名，需要位于 scripts/pyscripts/DepthEstimation/MoGe/checkpoints 下。
# 可选示例：moge-2-vits-normal、moge-2-vitb-normal、moge-2-vitl、moge-2-vitl-normal。
MoGeModel=moge-2-vitl-normal
# MoGe2 推理分辨率等级，范围通常为 0-9；越大细节越多，但速度更慢、显存占用更高。主实验默认 7。
MoGeResolutionLevel=7
# MoGe2 ViT token 数。0 表示使用 ResolutionLevel；>0 时会覆盖 ResolutionLevel。
MoGeNumTokens=0
# MoGe2 以及后续 TSDF 融合接受的最大深度，超过该值的深度会被截断。DenseDepth 启动前会先 Normalize，通常设为 50 即可。
MoGeMaxDepth=5000.0
# 是否使用 CUDA FP16 混合精度。仅在 Device=cuda 时生效。
MoGeUseFP16=true
# 是否使用 SfM 内参计算水平视场角 fov_x 并传入 MoGe，提高与 SfM 相机模型的一致性。
# 注意：MoGeUseSfMFov 只约束推理视场角，不保证多帧几何一致。
# 若 MoGe 结果用于 TSDF，建议开启 [DepthAlignment] Enable=true。
MoGeUseSfMFov=true
# 是否使用 MoGe 预测的有效区域 mask 过滤深度和点图。
MoGeApplyMask=false
# MoGe mask 阈值，范围通常为 0-1。值越低保留区域越多，值越高过滤越严格。
# 注意：MoGeApplyMask=false 时不会用 mask 清零最终深度，但该阈值仍会影响 MoGe 内部 FOV/shift 恢复时使用的有效区域。
MoGeMaskThreshold=0.3
# 是否额外保存 MoGe normal 结果，仅 normal 模型会输出。
MoGeSaveNormal=false

[DepthAlignment]
# 是否启用 SfM 全局深度后对齐。DepthAnythingV2、PixelPerfectDepth 、MoGe用于 TSDF 时必须开启该功能。
Enable=true
# 是否保存深度对齐实际使用的 SfM 稀疏深度图，供实验分析和回放。
# true：保存到 Depth/alignment_sparse_depth/<stem>_sparse_depth.npy。
# false：不保存该诊断图，仍正常执行对齐和融合；不会删除已有文件。
# 不控制 PriorDepthAnything/Murre 的 sparse_depth 输入先验。
SaveAlignDepth=true
# 对齐模型，可选：auto、linear、inverse、log、quadratic、inv_quad。
Mode=inv_quad
# 执行全局对齐所需的最少 SfM 有效观测数。
MinPoints=15
# 对齐后深度截断上限。DenseDepth 启动前会先 Normalize，通常设为 50 即可。
MaxDepth=50.0
# 分块数量。1 表示仅使用全局对齐；3 表示 3x3 分块局部修正。
Grid=5
# 分块重叠比例，推荐 0.2-0.4，用于减少块边缘接缝。
Overlap=0.3
# 是否在每个分块内重新拟合局部深度映射。
LocalFit=true
# 局部拟合模型选择，可选：global、per_block。global 表示使用全局最优模型类型重新拟合局部参数；per_block表示每个Block重新拟合5个模型，取其中最佳。
LocalModelMode=global
# 分块局部拟合所需的最少 SfM 有效观测数。
MinBlockPoints=7
# 单个分块最多用于局部拟合的稀疏点数量，避免高分辨率下局部 RANSAC 过慢。
MaxBlockSamples=300

#========== 分块质量加权 TSDF 融合配置 ==========
[WeightedTSDF]
# 是否启用 Global P75 AlignGrid 带权 TSDF。
# false：使用 Open3D 原始 TSDF Integrate。
# true：对齐窗口与权重窗口完全一致，使用相同的重叠区域与
# raised-cosine 窗口融合深度和残差指标；局部拟合成功窗口等权进入
# 累计全局 P75，fallback 窗口按 UnsupportedRegionScale 赋予低权；
# 体素使用可靠已接受观测的历史平均指标进行拒绝、软抑制和质量升级。
Enable=true

# 全局 P75 和体素历史使用的融合指标。
# E：RMSE_rel^2+Var_rel。
# RMSE：相对残差 RMSE。
# MSE：相对残差 RMSE 的平方，不包含方差。
GlobalP75Metric=MSE

# 建立或更新历史最佳残差所需严格超过的 Grid 样本数。
# 20 表示至少 21 个有效样本才能触发质量升级。
MinUpgradeSamples=20

# fallback 窗口的低质量尺度；取 0.1 时基础权重约为 0.0909。
UnsupportedRegionScale=0.10

# 当前指标相对体素可靠历史过差时的硬拒绝阈值。
HardRejectRatio=0.1

# 是否对通过硬门控、但质量低于历史平均的观测进行软抑制。
SoftSuppressionEnable=true

# 软抑制指数：w_effective=q_new*ratio^SoftSuppressionExponent。
SoftSuppressionExponent=1.0

# 每个体素的最大累计融合权重；0 表示不限制。
MaxVoxelWeight=0

# Weighted TSDF 点云和 Mesh 的累计体素权重提取阈值。
# Open3D 使用 weight>threshold；OriginTSDF 始终使用默认值 3.0。
ExtractionWeightThreshold=3

# 单帧升级权重上限的除数：
# upgrade_cap=ExtractionWeightThreshold/UpgradeCapDivisor。
# 默认 3/3=1，单次升级权重不会超过 1。
UpgradeCapDivisor=3.0

# 是否保存每帧融合指标、权重和资格诊断图。
SaveQualityMaps=true

[DenseFusion]
# 是否启用 TSDF 密集融合。也可以选择用外部的On-the-Fly TSDF，同样可以实时监控输出的深度图，进行实时重建
Enable=true
# TSDF 后端设备，可选：CPU、CUDA。VoxelBlockGrid 会在 Open3D CUDA 可用时使用 CUDA，否则自动回退 CPU。
Device=CUDA
# TSDF voxel 边长，越小越精细，但内存和计算量越高。
VoxelLength=0.03
# TSDF 截断距离相对于 voxel 边长的倍上数，通常设置为 3-8。
TruncVoxelMultiplier=8.0
# TSDF 融合接受的最大深度，超过该值的深度不会参与融合。DenseDepth 启动前会先 Normalize，通常设为 50 即可。
DepthMax=50.0
# 每融合 N 帧提取一次密集结果。
ExtractEveryNFrames=2
# UI 显示的 TSDF dense point 最大点数；超过后仅显示抽稀点，保存时仍导出完整点云。
MaxDisplayPoints=100000000
# 密集结果生成类型，可选：PointCloud、Mesh、Both。
OutputMode=PointCloud
# Mesh 颜色模式，可选：White、Image。密集点云始终使用影像颜色。
ColorMode=Image
# 无效帧跳过阈值：单张深度图中有效深度像素少于该值时，不进行 TSDF 融合。
MinValidDepthPixels=50


[Feedback]
# 注册影像数量达到该阈值后开始构建 Mesh。
StartCreateMesh = 30000000
# 每隔多少张新注册影像更新一次 Mesh，设置为 1 表示每次都更新。
Step = 1

[GpuDiagnostics]
# 是否启用 GPU 显存与 BA 规模诊断。默认关闭，开启后写入 DenseReconstruction/Timing。
Enable=true
# nvidia-smi 周期采样间隔，单位毫秒；用于记录 UI.exe 和 Depth worker 的进程级显存。
PollIntervalMs=2000
# 是否调用 nvidia-smi。若系统找不到 nvidia-smi，只会缺少进程级显存统计，不影响重建。
UseNvidiaSmi=true
# 是否在 DenseFusion、UI 上传等关键事件前后记录显存快照。
LogEventSnapshots=true
# 是否输出 Ceres BA 的影像数、3D点数、观测数、solver 类型、耗时和显存状态。
LogBundleAdjustmentStats=true

[Test]
ModelFolder=
Start=80
Step=10
End=110

[Experiment]
# 是否启用实验参数自动运行模式。
# false：保持手动创建项目和手动启动流程。
# true：启动后自动使用下面的项目和影像路径运行。
Enable=false
# 项目数据库文件路径，必须是 .db 文件；结果保存到该文件所在目录。
ProjectPath=../../examples/phantom3/output/phantom3.db
# 输入影像目录。
ImagePath=../../examples/phantom3/images
# 是否显示 UI。false 时隐藏窗口，但程序仍继续运行并保存结果。
ShowUI=true
# 全部影像发送完成且 Workflow 连续空闲多少秒后自动保存。
AutoSaveIdleSeconds=60

